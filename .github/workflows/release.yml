name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @klaracase/sdk run check-dist
      - run: pnpm check-package
      - run: pnpm docs:check
      # Trusted publishing (OIDC): both packages trust this repository and release.yml on npm
      # (owner 2026-11-02, allowed action "npm publish"). No token exists. OIDC needs npm 11.5.1
      # or later, so npm publishes the tarballs that pnpm packs (pnpm pack rewrites workspace:).
      - run: npm install -g npm@^11.5.1
      - name: The tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in sdk ai-sdk; do
            v=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "packages/$p is $v, tag is $tag"; exit 1; }
          done
      - name: Publish to npm
        run: |
          mkdir -p .release
          for p in sdk ai-sdk; do (cd "packages/$p" && pnpm pack --pack-destination ../../.release); done
          npm publish .release/klaracase-sdk-*.tgz --provenance --access public
          npm publish .release/klaracase-ai-sdk-*.tgz --provenance --access public
