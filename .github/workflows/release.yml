name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @klaracase/sdk run check-dist
      - run: pnpm check-package
      - run: pnpm docs:check
      # TODO: needs npm trusted publishing configured for @klaracase (npm org "klaracase", a
      # trusted publisher entry for this repository and the workflow file release.yml).
      # Until that exists, this step stays commented out and the workflow only builds.
      # - run: pnpm -r publish --provenance --access public --no-git-checks
